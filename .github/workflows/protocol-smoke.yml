name: Protocol Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'workers/src/index.ts'
      - '.github/workflows/protocol-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'workers/src/index.ts'
      - '.github/workflows/protocol-smoke.yml'

jobs:
  smoke:
    name: Registry and Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

      - name: Run protocol smoke checks
        run: bash scripts/tools/protocol-smoke.sh